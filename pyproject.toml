[project]
name = "ennoscholar-legal-fulltext-mcp"
version = "1.1.0"
description = "MCP server for legal scholarly full-text resolution"
requires-python = ">=3.11"
dependencies = [
  "mcp[cli]>=1.27,<2",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["mcp_servers/legal_fulltext_mcp/tests"]
