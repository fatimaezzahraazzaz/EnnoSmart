services:
  redis:
    image: redis:7-alpine
    container_name: ennosmart-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ennosmart_redis_data:/data]

  grobid:
    image: ${GROBID_IMAGE:-grobid/grobid:0.9.0-full}
    container_name: ennosmart-grobid
    restart: unless-stopped
    ports: ["8070:8070"]

volumes:
  ennosmart_redis_data:
