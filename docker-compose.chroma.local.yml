services:
  chroma:
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      CHROMA_PERSIST_PATH: /data
      CHROMA_ALLOW_RESET: "false"
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - ennosmart_chroma_local_data:/data
    ports:
      - "127.0.0.1:8005:8000"
    healthcheck:
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/8000 && printf "GET /api/v2/heartbeat HTTP/1.0\r\nHost: localhost\r\n\r\n" >&3 && head -n 1 <&3 | grep -q "200 OK"']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

volumes:
  ennosmart_chroma_local_data:
